[package]
name = "justtype-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "catch-panic"] }

diesel = { version = "2.2", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
r2d2 = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# The prompt day is Pacific time, and each writer's email goes out in theirs.
chrono-tz = "0.10"

argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

similar = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
hmac = "0.12"
sha1 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
pulldown-cmark = { version = "0.13", default-features = false }
# Liang patterns from TeX, embedded, for the book-layout PDF's hyphenation.
hyphenation = { version = "0.8", features = ["embed_all"] }
