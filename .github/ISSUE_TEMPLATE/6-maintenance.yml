name: 🧹 Maintenance / Technical Debt
description: Refactoring, dependencies, CI/CD, cleanup, or infrastructure work.
title: "[Maint]: "
labels: ["maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        Primarily for maintainers and contributors. Examples: upgrade TipTap or Axum, replace a deprecated API, refactor the sync layer, improve test coverage, remove dead code, speed up CI.

  - type: dropdown
    id: type
    attributes:
      label: Type of work
      multiple: true
      options:
        - Refactoring
        - Dependency update
        - CI/CD
        - Testing
        - Performance
        - Infrastructure
        - Database / migrations
        - Shared types (backend ↔ web ↔ iOS)
        - Code cleanup
        - Developer experience (xtask, Makefile)
        - Security hardening
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Backend (Rust)
        - Web (React)
        - iOS (Swift)
        - xtask / scripts
        - CI / GitHub Actions
        - Docker
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this needed?
      description: What's the cost of leaving it alone?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Rough plan, or the specific files/crates/packages involved.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Breaking changes, migration requirements, offline-sync compatibility with older iOS builds, areas likely to regress.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
