name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p justtype-backend
      # Fails if the checked-in client types no longer match the handlers.
      - run: cargo xtask codegen --check

  # epubcheck is Java, so it runs here against generated fixtures (split,
  # single file, RTL, with a cover, notes) and stays out of the runtime image.
  epubcheck:
    runs-on: ubuntu-latest
    env:
      EPUBCHECK_VERSION: "5.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: EPUB_FIXTURES="$RUNNER_TEMP/epubs" cargo test -p justtype-backend epub_fixtures -- --ignored
      - run: |
          curl -sSL -o "$RUNNER_TEMP/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
      - run: |
          status=0
          for f in "$RUNNER_TEMP"/epubs/*.epub; do
            echo "::group::$(basename "$f")"
            java -jar "$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/smoke.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios/JustTypeKit
    steps:
      - uses: actions/checkout@v4
      # The shared package builds for macOS too, so this needs no simulator.
      - run: swift build
      - run: swift test
