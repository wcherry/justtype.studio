# Generate Scriptorium.xcodeproj with:  xcodegen generate
# (brew install xcodegen). The project file itself is not checked in — the
# generator is the source of truth, which keeps merge conflicts out of it.
name: Scriptorium
options:
  bundleIdPrefix: app.scriptorium
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ScriptoriumKit:
    path: ScriptoriumKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    API_BASE_URL: http://127.0.0.1:8088/api
    # scripts/deploy_testflight.sh rewrites these two and regenerates the
    # project, so this file is the source of truth for both. The Info.plist
    # below refers to them rather than repeating the numbers.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      API_BASE_URL: https://www.justtype.studio/api

targets:
  Scriptorium:
    type: application
    platform: iOS
    sources:
      - path: Scriptorium/Sources
    info:
      # XcodeGen generates this file, so these keys live here rather than in the
      # plist — anything hand-edited there is lost on the next `xcodegen generate`.
      path: Scriptorium/Info.plist
      properties:
        CFBundleDisplayName: Just Type Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        # Development only: the local backend is plain HTTP. Drop this before
        # shipping anything that talks to a real host.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: ScriptoriumKit
        product: ScriptoriumUI
      - package: ScriptoriumKit
        product: ScriptoriumKit
      - target: ScriptoriumWidget
        embed: true
    # DEVELOPMENT_TEAM lives here rather than in this file: it is a property of
    # whoever is building, not of the project. scripts/ios_signing.sh writes it
    # from scripts/.env before anything runs xcodegen, and Xcode reads the same
    # file when the project is opened by hand.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    entitlements:
      path: Scriptorium/Scriptorium.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.scriptorium.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scriptorium.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Today's words on the home screen. It reads a file the app leaves behind
  # rather than signing in: an extension holding a refresh token for a progress
  # bar is a credential in a second place for no reason.
  ScriptoriumWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ScriptoriumWidget
    dependencies:
      - package: ScriptoriumKit
        product: ScriptoriumKit
    info:
      path: ScriptoriumWidget/Info.plist
      properties:
        CFBundleDisplayName: Just Type Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ScriptoriumWidget/ScriptoriumWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.scriptorium.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scriptorium.ios.widget
        INFOPLIST_KEY_CFBundleDisplayName: Just Type Studio
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig

  # The editing surface asked of a running simulator: the keyboard, the caret,
  # typing, selection and undo, none of which a command line can answer.
  ScriptoriumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Scriptorium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scriptorium.ios.uitests
        TEST_TARGET_NAME: Scriptorium
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
