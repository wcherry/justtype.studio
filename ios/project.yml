# Generate Scriptorium.xcodeproj with:  xcodegen generate
# (brew install xcodegen). The project file itself is not checked in — the
# generator is the source of truth, which keeps merge conflicts out of it.
name: Scriptorium
options:
  bundleIdPrefix: app.scriptorium
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ScriptoriumKit:
    path: ScriptoriumKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    API_BASE_URL: http://127.0.0.1:8088/api
  configs:
    Release:
      API_BASE_URL: https://api.scriptorium.app/api

targets:
  Scriptorium:
    type: application
    platform: iOS
    sources:
      - path: Scriptorium/Sources
    info:
      # XcodeGen generates this file, so these keys live here rather than in the
      # plist — anything hand-edited there is lost on the next `xcodegen generate`.
      path: Scriptorium/Info.plist
      properties:
        CFBundleDisplayName: Scriptorium
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        # Development only: the local backend is plain HTTP. Drop this before
        # shipping anything that talks to a real host.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: ScriptoriumKit
        product: ScriptoriumUI
      - package: ScriptoriumKit
        product: ScriptoriumKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.scriptorium.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
